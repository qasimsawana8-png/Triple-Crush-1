name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Environment and Keystore
        run: |
          # 1. Accept all Android SDK licenses
          echo "Accepting Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          # 2. Setup .env file
          echo "Setting up .env file..."
          if [ -f .env.example ]; then
            cp -f .env.example .env
          else
            touch .env
          fi

          # 3. Setup debug and release keystores
          echo "Setting up keystores..."
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f release.keystore ] || [ ! -s release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -storepass triplecrush123 -alias triplecrush -keypass triplecrush123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Triple Crush,OU=Games,O=Triple Crush Studio,C=US"
          fi

      - name: Build Release and Debug APKs
        run: |
          gradle assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace -x test -x lint

      - name: Upload Release APK (For Amazon Appstore & Stores)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debug APK (For Local Testing)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-bundle-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 7

